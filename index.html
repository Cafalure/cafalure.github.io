<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Compagnie des Lutins</title>
    <style>
        body { font-family: 'Arial', sans-serif; background: #0f0f13; color: #fff; text-align: center; padding: 40px 20px; margin: 0; }
        .logo { width: 150px; height: 150px; border-radius: 50%; border: 4px solid #4a6cf7; object-fit: cover; margin-bottom: 15px; box-shadow: 0 0 20px rgba(74,108,247,0.5); }
        h1 { color: #4a6cf7; font-size: 2.2rem; margin-bottom: 5px; text-shadow: 0 0 10px rgba(74,108,247,0.5); }
        h2 { color: #aaa; font-size: 1.2rem; font-weight: normal; margin-top: 0; margin-bottom: 30px; font-style: italic; }
        .container { max-width: 400px; margin: 0 auto; }
        a { display: block; background: #1a1a22; color: #e8e8f0; padding: 18px; margin: 15px 0; text-decoration: none; border-radius: 12px; font-weight: bold; font-size: 1.1rem; border: 2px solid #2e2e3e; transition: all 0.3s ease; }
        a:hover { background: #e94560; color: #fff; border-color: #e94560; transform: scale(1.05); }
        .footer { margin-top: 40px; font-size: 0.8rem; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <img src="lion.png" alt="Léo le lutin" class="logo">
        
        <h1>La Compagnie des Lutins</h1>

        <div class="footer">
            © 2026 La Compagnie des Lutins
        </div>
    </div>
</body>
</html>
