<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L'univers de Léo</title>
    <style>
        body { font-family: 'Arial', sans-serif; background: #0f0f13; color: #fff; text-align: center; padding: 40px 20px; margin: 0; }
        h1 { color: #4a6cf7; font-size: 2rem; margin-bottom: 30px; text-shadow: 0 0 10px rgba(74,108,247,0.5); }
        .container { max-width: 400px; margin: 0 auto; }
        a { display: block; background: #1a1a22; color: #e8e8f0; padding: 18px; margin: 15px 0; text-decoration: none; border-radius: 12px; font-weight: bold; font-size: 1.1rem; border: 2px solid #2e2e3e; transition: all 0.3s ease; }
        a:hover { background: #e94560; color: #fff; border-color: #e94560; transform: scale(1.05); }
        /* Bouton pack mis en avant */
        a.pack { background: linear-gradient(135deg, #e94560, #4a6cf7); border-color: #e94560; font-size: 1.15rem; padding: 22px; box-shadow: 0 0 20px rgba(233,69,96,0.4); }
        a.pack:hover { background: linear-gradient(135deg, #ff5a75, #5a7cff); transform: scale(1.07); }
        a.pack .pack-title { display: block; font-size: 1.2rem; margin-bottom: 4px; }
        a.pack .pack-btn { display: inline-block; background: #fff; color: #e94560; padding: 6px 18px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; margin-top: 10px; }
        .pack-hint { font-size: 0.8rem; color: #aaa; margin-top: -5px; margin-bottom: 15px; }
        /* Boutique Nova Art Gallery : bleu nuit et doré */
        a.nova { background: linear-gradient(135deg, #12223f, #1c3152); border-color: #c9a65b; color: #f8edd1; box-shadow: 0 0 15px rgba(201,166,91,0.2); padding: 20px 18px; }
        a.nova:hover { background: linear-gradient(135deg, #1d355e, #2a466d); border-color: #f0ce83; color: #fff5d8; transform: scale(1.05); }
        .nova-title { display: block; font-size: 1.2rem; }
        .nova-subtitle { display: block; font-size: 0.85rem; font-weight: normal; margin-top: 7px; color: #e0d0a8; }
        .footer { margin-top: 40px; font-size: 0.8rem; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌙 L'Univers de Léo</h1>

        <a href="https://cafalure.gumroad.com/l/lacompagniedeslutins" target="_blank" class="pack" rel="noopener noreferrer">
            <span class="pack-title">🚀 Le Pack des 3 Générateurs</span>
            <span class="pack-btn">🛒 Acheter maintenant</span>
        </a>
        <p class="pack-hint">3 générateurs · vidéos, images, voix</p>

        <a href="https://www.zazzle.fr/store/novaartgallery" target="_blank" class="nova" rel="noopener noreferrer">
            <span class="nova-title">🖼️ Nova Art Gallery</span>
            <span class="nova-subtitle">Découvrir la boutique d'affiches et d'art mural</span>
        </a>

        <a href="https://www.amazon.fr/dp/B0HPCP91X2" target="_blank" rel="noopener noreferrer">📚 Découvrir le livre sur Amazon</a>

        <a href="https://www.youtube.com/@Cafalure" target="_blank" rel="noopener noreferrer">🎬 Regarder les aventures sur YouTube</a>

        <a href="https://www.tiktok.com/@cafalure4" target="_blank" rel="noopener noreferrer">🎵 Suivre sur TikTok</a>

        <div class="footer">
            © 2026 La Compagnie des Lutins
        </div>
    </div>
</body>
</html>
